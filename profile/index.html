<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BACKPACK | Profile</title>
  <meta property="og:image" content="/assets/img/coin.jpg" />
  <link rel="icon" href="/assets/img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Lilita+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <div class="scene alley-page">
    <div class="alley-bg"></div>
    <div class="overlay-dark"></div>
    <header class="top">
      <div class="wrap top-inner">
        <a class="logo" href="/" aria-label="BACKPACK home">
          <svg class="logo-swing" viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="54" width="404" height="96" rx="24" fill="#FFD43B" stroke="#1B1438" stroke-width="8"/>
            <rect x="22" y="66" width="376" height="72" rx="16" fill="#19663A"/>
            <text x="210" y="118" text-anchor="middle" fill="#fff" font-family="Lilita One, Impact, sans-serif" font-size="58">BACKPACK</text>
            <circle cx="210" cy="46" r="40" fill="#FFD43B" stroke="#1B1438" stroke-width="8"/>
            <circle cx="210" cy="46" r="30" fill="#19663A"/>
            <text x="210" y="54" text-anchor="middle" fill="#fff" font-family="Lilita One, Impact, sans-serif" font-size="18">PACK</text>
          </svg>
        </a>
        <nav class="nav-pills">
          <a href="/">Home</a>
          <a href="/alley">Alley</a>
          <a href="/fire">Fire</a>
          <a class="active" href="/profile">Profile</a>
        </nav>
        <div class="top-actions">
          <a class="icon-btn" href="/guide">?</a>
          <button class="btn btn-connect" type="button" data-action="connect">Connect</button>
        </div>
      </div>
    </header>
    <main class="wrap page">
      <div class="card" style="max-width:520px;padding:22px">
        <img src="/assets/img/coin.jpg" alt="$BACKPACK" style="width:92px;height:92px;object-fit:cover;border-radius:16px;border:3px solid var(--ink);background:#111" />
        <h1 style="font-family:var(--display);margin:12px 0 6px">Your profile</h1>
        <p class="hand" style="font-size:22px">Connect a wallet to dig through your stash.</p>
        <p class="mono" style="font-family:var(--mono);font-size:13px">Chain: Robinhood · 4663<br>CA: <button class="ca-chip" type="button" data-action="copy-ca" data-ca-full title="Copy CA">coming soon</button></p>
        <div class="cta-row">
          <button class="btn btn-banana btn-lg" type="button" data-action="connect">Connect wallet</button>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav">
    <a href="/">HOME</a>
    <a href="/alley">ALLEY</a>
    <a href="/fire">FIRE</a>
    <button type="button" data-action="connect">CONNECT</button>
  </nav>
  <div class="modal" id="connect-modal">
    <div class="card box">
      <h3 style="font-family:var(--display);margin:0 0 8px">Connect</h3>
      <p>CA <code data-ca-full>coming soon</code></p>
      <div class="cta-row" style="margin-top:12px">
        <a class="btn btn-pine" href="https://www.ponsfamily.com/launchpad" target="_blank" rel="noopener">Open Pons</a>
        <button class="btn" type="button" data-action="close">Close</button>
      </div>
    </div>
  </div>
  <script src="/assets/js/site.js"></script>
</body>
</html>
